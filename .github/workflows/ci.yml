name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    name: Build, Test & Sanitize (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install raylib (macOS)
        if: runner.os == 'macOS'
        run: brew install raylib pkg-config

      - name: Install raylib (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libraylib-dev

      - name: Build with strict warnings (-Werror)
        run: make clean && make WARN_FLAGS="-Wall -Wextra -Wpedantic -Werror" all test_api

      - name: Run C unit & socket API tests
        run: ./test_api

      - name: Run AddressSanitizer + UndefinedBehaviorSanitizer tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make WARN_FLAGS="-Wall -Wextra -Wpedantic -Werror" sanitize

      - name: Validate Python example applets
        run: python3 -m py_compile examples/*.py
