name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v1.2.0
        required: true

permissions:
  contents: read

env:
  RAYLIB_VERSION: "6.2"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # raylib is linked statically so the binaries run without it installed.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install raylib pkg-config
          RL="$(brew --prefix raylib)"
          make release RAYLIB_CFLAGS="-I$RL/include" \
            RAYLIB_LIBS="$RL/lib/libraylib.a -framework OpenGL -framework Cocoa -framework IOKit -framework CoreVideo -framework CoreAudio -framework AudioToolbox -framework QuartzCore"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          RAYLIB_SHARED=OFF .github/scripts/install-raylib.sh "$RAYLIB_VERSION"
          make release RAYLIB_LIBS="-L/usr/local/lib -l:libraylib.a -lGL -lX11 -lm -ldl -lrt -lpthread"

      - name: Package
        run: |
          ./markee --help | head -1
          ./packaging/build-tarball.sh --version "${TAG#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: markee-${{ matrix.name }}
          path: build/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "markee $TAG" --generate-notes --verify-tag
          fi
