name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Install raylib
        run: .github/scripts/install-raylib.sh 6.2
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp, python
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: make all test_api
      - uses: github/codeql-action/analyze@v4
