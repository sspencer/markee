name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command line, HTTP request (curl), or config.ini snippet.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, markee version or commit, raylib version
      placeholder: macOS 15.2, v1.0.0, raylib 6.2
